name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    # The package targets .macOS(.v26) and uses Liquid Glass APIs, so it needs
    # the macOS 26 SDK. Older runner images cannot compile it.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify the toolchain
        # The macos-26 image ships Xcode 26 as the default, which is what the
        # package needs. Fail loudly rather than building against the wrong SDK.
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -q "macOS 26" || {
            echo "::error::No macOS 26 SDK on this runner"
            exit 1
          }

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package app bundle
        run: scripts/build_app.sh

      - name: Verify the bundle is signed and launches
        run: |
          codesign --verify --deep --strict dist/SpaceCrunch.app
          test -x dist/SpaceCrunch.app/Contents/MacOS/SpaceCrunch
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            dist/SpaceCrunch.app/Contents/Info.plist

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: SpaceCrunch-macOS
          path: dist/SpaceCrunch.app
          retention-days: 14
